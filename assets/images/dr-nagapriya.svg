<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3977"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="380" height="460" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="10" y="10" width="380" height="150" rx="28" fill="url(#docGrad)"/>
  <rect x="10" y="130" width="380" height="30" fill="url(#docGrad)"/>

  <!-- Halo ring around avatar -->
  <circle cx="200" cy="150" r="84" fill="#ffffff"/>
  <circle cx="200" cy="150" r="78" fill="#e0f2fe" stroke="url(#badgeGrad)" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Stylized Doctor Silhouette / Avatar -->
  <circle cx="200" cy="122" r="32" fill="#0a3977"/>
  <!-- Female Doctor Hair Silhouette -->
  <path d="M165 125 C165 88 235 88 235 125 C235 155 225 160 225 160 C225 160 215 130 200 130 C185 130 175 160 175 160 C175 160 165 155 165 125 Z" fill="#072652"/>
  
  <!-- Face & Neck -->
  <path d="M186 138 L214 138 L210 162 C210 168 190 168 190 162 Z" fill="#fed7aa"/>
  <circle cx="200" cy="126" r="24" fill="#fed7aa"/>

  <!-- Doctor Coat & Stethoscope -->
  <!-- Shoulders / White Coat -->
  <path d="M135 228 C135 185 160 168 200 168 C240 168 265 185 265 228 L272 265 L128 265 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Teal / Blue Scrub Inner -->
  <polygon points="182,168 218,168 200,210" fill="#008080"/>
  <!-- Coat Lapels -->
  <polygon points="170,168 184,235 200,235 182,168" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="230,168 216,235 200,235 218,168" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Stethoscope around neck -->
  <path d="M178 174 C178 210 188 235 200 235 C212 235 222 210 222 174" fill="none" stroke="#0a3977" stroke-width="4" stroke-linecap="round"/>
  <!-- Stethoscope chest piece -->
  <circle cx="215" cy="230" r="7" fill="url(#badgeGrad)"/>

  <!-- Doctor Name & Title Card in Card Lower Half -->
  <text x="200" y="295" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#0a3977" text-anchor="middle">DR. NAGAPRIYA MINNEKANTI</text>
  <text x="200" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="1.5">MBBS, MD (Gen Med), DNB (Endocrinology)</text>
  <text x="200" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#008080" text-anchor="middle">Lead Consultant Endocrinologist &amp; Diabetologist</text>
  <text x="200" y="356" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">GMC • Manipal University • KIMS Hospital</text>

  <!-- Golden Ribbon / Shield of Honors -->
  <g transform="translate(50, 375)">
    <rect width="300" height="44" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="25" cy="22" r="14" fill="url(#badgeGrad)"/>
    <text x="25" y="27" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="900">★</text>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#854d0e">5 GOLD MEDALS &amp; BEST OUTGOING STUDENT</text>
    <text x="48" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#a16207">1st Palnadu Endocrinologist to Present at US ENDO</text>
  </g>

  <!-- Bottom Pill: 7 Top Society Memberships -->
  <g transform="translate(50, 428)">
    <rect width="300" height="24" rx="12" fill="#e0f2fe"/>
    <text x="150" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">MEMBER: ESI • ENDO(USA) • AACE • RSSDI • ISBMR • API • IMA</text>
  </g>
</svg>