<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3977"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>
  <!-- Circular grid rings -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="300" cy="200" r="110" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <circle cx="300" cy="200" r="60" fill="#ffffff" opacity="0.1"/>

  <!-- Central Hub: SPS Endocrine Core -->
  <circle cx="300" cy="200" r="48" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="300" cy="200" r="42" fill="#0a3977"/>
  <text x="300" y="196" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#d4af37" text-anchor="middle">SPS</text>
  <text x="300" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ENDOCRINE</text>

  <!-- Node 1: Diabetes & Metabolism (Top Right) -->
  <line x1="300" y1="200" x2="450" y2="110" stroke="#d4af37" stroke-width="2.5" opacity="0.7" stroke-dasharray="4 4"/>
  <circle cx="450" cy="110" r="34" fill="#ffffff" filter="url(#glow)"/>
  <text x="450" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#0a3977" text-anchor="middle">DIABETES</text>
  <text x="450" y="119" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Type 1 &amp; 2 • CGM</text>

  <!-- Node 2: Pregnancy Endocrinology (Right) -->
  <line x1="300" y1="200" x2="490" y2="220" stroke="#d4af37" stroke-width="2.5" opacity="0.7" stroke-dasharray="4 4"/>
  <circle cx="490" cy="220" r="34" fill="#ffffff" filter="url(#glow)"/>
  <text x="490" y="216" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#9333ea" text-anchor="middle">PREGNANCY</text>
  <text x="490" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">GDM • Thyroid</text>

  <!-- Node 3: Growth & Puberty (Bottom Right) -->
  <line x1="300" y1="200" x2="420" y2="320" stroke="#d4af37" stroke-width="2.5" opacity="0.7" stroke-dasharray="4 4"/>
  <circle cx="420" cy="320" r="34" fill="#ffffff" filter="url(#glow)"/>
  <text x="420" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0284c7" text-anchor="middle">GROWTH</text>
  <text x="420" y="328" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Height • Puberty</text>

  <!-- Node 4: Obesity & Metabolism (Bottom Left) -->
  <line x1="300" y1="200" x2="180" y2="320" stroke="#d4af37" stroke-width="2.5" opacity="0.7" stroke-dasharray="4 4"/>
  <circle cx="180" cy="320" r="34" fill="#ffffff" filter="url(#glow)"/>
  <text x="180" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#d97706" text-anchor="middle">OBESITY</text>
  <text x="180" y="328" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Medical Reset</text>

  <!-- Node 5: Thyroid Disorders (Left) -->
  <line x1="300" y1="200" x2="110" y2="220" stroke="#d4af37" stroke-width="2.5" opacity="0.7" stroke-dasharray="4 4"/>
  <circle cx="110" cy="220" r="34" fill="#ffffff" filter="url(#glow)"/>
  <text x="110" y="216" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#008080" text-anchor="middle">THYROID</text>
  <text x="110" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Nodules • USG</text>

  <!-- Node 6: Bone & Pituitary (Top Left) -->
  <line x1="300" y1="200" x2="150" y2="110" stroke="#d4af37" stroke-width="2.5" opacity="0.7" stroke-dasharray="4 4"/>
  <circle cx="150" cy="110" r="34" fill="#ffffff" filter="url(#glow)"/>
  <text x="150" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0e7490" text-anchor="middle">BONE / HORMONES</text>
  <text x="150" y="119" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Osteoporosis • PCOS</text>

  <!-- Header Banner Inside -->
  <text x="300" y="42" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">COMPREHENSIVE ENDOCRINE &amp; METABOLIC SCIENCES</text>
  <text x="300" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#d4af37" text-anchor="middle">Arundelpet, Palnadu Road, Narasaraopet • Dr. Nagapriya Minnekanti</text>
</svg>